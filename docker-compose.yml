services:
  redis:
    image: redis:7
    ports:
      - "6380:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.10
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    restart: unless-stopped
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # This single service handles all your background queues via Horizon
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - redis
    command: php artisan horizon
    environment:
      - APP_ENV=local
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_CACHE_DB=1
      - REDIS_PREFIX=laravel
      - DB_MONGO_HOST=host.docker.internal
      - DB_MONGO_PORT=27017
      - DB_MONGO_DATABASE=news_aggregator
      - MONGODB_URI=mongodb://host.docker.internal:27017/news_aggregator
      - DB_HOST=host.docker.internal
      - OPENAI_API_KEY=

volumes:
  redis_data:
  es_data:
